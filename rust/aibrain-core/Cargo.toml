[package]
name = "aibrain-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Watches Obsidian vaults, keeps Postgres in step, and serves the corpus."

[[bin]]
name = "aibrain-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["http1", "json", "query", "tokio"] }
blake3 = "1"
notify = "6"
notify-debouncer-full = "0.3"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-none", "postgres", "macros", "migrate", "chrono", "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
