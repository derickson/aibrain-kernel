document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tent:center;align-self:stretch} .chips button{flex:1;justify-content:center} }\n::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:rgba(127,216,232,.18);border-radius:4px}\n<\u002Fstyle>\n<script type=\"module\" src=\"f455eaf1-8b78-4400-b4b1-84c9181c735b\"><\u002Fscript>\n<\u002Fhelmet>\n<div data-screen-label=\"Brains\" style=\"display:flex;width:100%;height:100vh;overflow:hidden;background:#04060b;font-family:Manrope,system-ui,sans-serif;color:#e6edf5;-webkit-font-smoothing:antialiased\">\n\n  <div style=\"flex:none;width:{{ leftWidth }};min-width:0;overflow:hidden;transition:width .45s cubic-bezier(.2,.8,.2,1);border-right:1px solid rgba(127,216,232,.1);background:rgba(7,11,18,.97);display:flex;flex-direction:column\">\n    <div style=\"display:flex;flex-direction:column;height:100%;width:{{ leftInner }}\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid rgba(127,216,232,.1)\">\n        <span style=\"width:12px;height:12px;border-radius:50%;flex:none;background:{{ agentColor }};box-shadow:0 0 14px {{ agentColor }}, 0 0 30px {{ agentColor }}\"><\u002Fspan>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:-0.01em\">{{ agentName }}<\u002Fdiv>\n          <div style=\"font:500 10px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#8fb3c4;margin-top:2px\">{{ agentMeta }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onCloseChat }}\" style=\"width:32px;height:32px;border-radius:8px;border:1px solid rgba(127,216,232,.14);background:transparent;color:#a3b0c2;font-size:16px;cursor:pointer\" style-hover=\"color:#fff;border-color:rgba(127,216,232,.5)\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-height:0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px\">\n        <sc-if value=\"{{ chatEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:8px\">\n            <div style=\"font:400 14px/1.6 Manrope,system-ui,sans-serif;color:#a3b0c2;text-wrap:pretty\">{{ agentIntro }}<\u002Fdiv>\n            <div style=\"font:500 10px 'JetBrains Mono',monospace;letter-spacing:.18em;color:#5f6d82;margin-top:10px\">TRY ASKING<\u002Fdiv>\n            <sc-for list=\"{{ suggestions }}\" as=\"sg\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ sg.onClick }}\" style=\"text-align:left;padding:10px 14px;border-radius:10px;border:1px solid rgba(127,216,232,.14);background:rgba(127,216,232,.05);color:#d5dfea;font:500 13px/1.4 Manrope,system-ui,sans-serif;cursor:pointer\" style-hover=\"border-color:rgba(127,216,232,.45);background:rgba(127,216,232,.1)\">{{ sg.text }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"0\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;align-items:{{ m.align }}\">\n            <div style=\"max-width:92%;padding:{{ m.pad }};border-radius:12px;background:{{ m.bg }};border:1px solid {{ m.border }};font:400 14px/1.65 Manrope,system-ui,sans-serif;color:#e6edf5;white-space:pre-wrap;text-wrap:pretty\">{{ m.text }}<span style=\"display:{{ m.cursorDisplay }};width:7px;height:14px;background:{{ m.color }};vertical-align:-2px;margin-left:2px;border-radius:1px\"><\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ m.hasCites }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;max-width:92%\">\n                <sc-for list=\"{{ m.cites }}\" as=\"c\" hint-placeholder-count=\"0\">\n                  <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:999px;border:1px solid rgba(127,216,232,.18);background:rgba(10,16,26,.8);color:#d5dfea;font:500 12px Manrope,system-ui,sans- rgin:26px 0 10px\">Linked notes · {{ linkedCount }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <sc-for list=\"{{ linked }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:transparent;color:#d5dfea;font:500 13px Manrope,system-ui,sans-serif;cursor:pointer;text-align:left\" style-hover=\"background:rgba(127,216,232,.08);color:#fff\"><span style=\"width:7px;height:7px;border-radius:50%;flex:none;background:{{ l.color }}\"><\u002Fspan><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ l.name }}<\u002Fspan><span style=\"font:500 10px 'JetBrains Mono',monospace;color:#7d8ba0;letter-spacing:.08em\">{{ l.brain }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ resultsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px 12px\">\n            <div style=\"font:500 10px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#7d8ba0;padding:0 8px 10px\">{{ resultsLabel }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"0\">\n                <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:transparent;color:#d5dfea;font:500 13px Manrope,system-ui,sans-serif;cursor:pointer;text-align:left\" style-hover=\"background:rgba(127,216,232,.08);color:#fff\"><span style=\"width:7px;height:7px;border-radius:50%;flex:none;background:{{ r.color }};box-shadow:0 0 6px {{ r.color }}\"><\u002Fspan><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.name }}<\u002Fspan><span style=\"font:500 10px 'JetBrains Mono',monospace;color:#7d8ba0;letter-spacing:.08em;white-space:nowrap\">{{ r.meta }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rightEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:40px 28px;display:flex;flex-direction:column;gap:12px;color:#7d8ba0;font:400 14px/1.6 Manrope,system-ui,sans-serif;text-wrap:pretty\">\n            <div style=\"font:500 10px 'JetBrains Mono',monospace;letter-spacing:.18em;color:#5f6d82\">NOTES<\u002Fdiv>\n            <div>Search across all brains, click a note in the universe, or follow a citation from an agent.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;rotationSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;linkOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.24,&quot;min&quot;:0.05,&quot;max&quot;:0.6,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Connections&quot;},&quot;showAllLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Labels&quot;}}\">\nconst NAMES = {\n  family: ['Birthday list', 'School calendar', 'Grandma\\u2019s stories', 'Weekend plans', 'Chore rotation', 'Gift ideas'],\n  recipes: ['Sourdough starter', 'Sunday roast', 'Weeknight curry', 'Pantry staples', 'Miso ramen', 'Pie crust'],\n  health: ['Sleep log', 'Running plan', 'Doctor visits', 'Supplements', 'Stretch routine', 'Allergies'],\n  finance: ['Monthly budget', 'Mortgage notes', 'Tax folder', 'Subscriptions', 'Emergency fund', 'Car costs'],\n  travel: ['Japan itinerary', 'Packing list', 'Lisbon cafés', 'Road trip 2025', 'Points strategy', 'Cabin weekend'],\n  claude: ['Claude Code', 'Project conventions', 'Preferred stack', 'Deploy notes', 'Style rules', 'Repo map', 'Prompt library', 'Error patterns'],\n  codex: ['Codex session', 'Refactor plan', 'Test matrix', 'Schema notes', 'API contracts', 'Migration log'],\n  repos: ['brain-viz', 'agent-router', 'mcp-elastic', 'acp-bridge', 'notes-indexer', 'ui-kit'],\n  skills: ['clickup-searcher (agent)', 'notion-sync (agent)', 'summarizer (skill)', 'transcriber (skill)', 'researcher (agent)', 'scheduler (agent)'],\n  papers: ['Attention is all you need', 'RAG survey', 'Graph embeddings', 'Vector DB benchmarks', 'Agent protocols', 'Sparse retrieval'],\n  meetings: ['Weekly sync', 'One-off calls', 'Client kickoff', 'Design review', 'Sprint retro', 'Investor update', 'Partner call', 'Standup notes'],\n  wiki: ['Onboarding checklist', 'Pricing tiers', 'Brand voice', 'Refund policy', 'Team directory', 'Hiring rubric', 'Support macros'],\n  projects: ['Funnel Map', 'Launch plan', 'Website v3', 'Course build', 'Newsletter', 'Community hub'],\n  video: ['Research-backed YouTube script', 'Hook formulas', 'Thumbnail study', 'Retention curve', 'Channel audit', 'Editing pipeline'],\n  clients: ['Acme renewal', 'Northwind scope', 'Globex proposal', 'Initech QBR', 'Umbrella onboarding'],\n};\nconst src = (id, name, color, count) => ({ id, name, color, count, names: NAMES[id] });\nconst BRAINS = [\n  { id: 'home', name: 'Home', center: [-19, 0.5, -2], radius: 6.6, seed: 11, sources: [src('family', 'Family', '#f06aa6', 46), src('recipes', 'Recipes', '#f2952d', 58), src('health', 'Health', '#3ecf9a', 40), src('finance', 'Finance', '#f0c030', 36), src('travel', 'Travel', '#4db3f0', 52)] },\n  { id: 'tech', name: 'Technology', center: [0, 1.5, 4], radius: 7.2, seed: 7, sources: [src('claude', 'Claude memory', '#f0c030', 72), src('codex', 'Codex memory', '#4fd6d0', 48), src('repos', 'Repos', '#4db3f0', 66), src('skills', 'Skills & agents', '#9b7cf0', 44), src('papers', 'Papers', '#f06aa6', 38)] },\n  { id: 'work', name: 'Work', center: [19, -1, -3], radius: 7.6, seed: 23, sources: [src('meetings', 'Meetings', '#f2952d', 96), src('wiki', 'Business wiki', '#4db3f0', 40), src('projects', 'Projects', '#3ecf9a', 52), src('video', 'Video knowledge', '#f06aa6', 70), src('clients', 'Clients', '#f0c030', 34)] },\n];\nconst AGENTS = [\n  { id: 'hermes', name: 'Hermes', protocol: 'AI AGENT', color: '#b48cff', pos: [-9, 8, 7], intro: 'Hermes reasons across all three brains. Ask a question and it will trace the notes that answer it.', suggestions: ['What do I know about funnels?', 'Connect my running plan to my sleep log', 'Which repos touch the agent protocols?'], voice: 'traced' },\n  { id: 'elastic', name: 'Elasticsearch Agent Builder', protocol: 'MCP', color: '#ffb347', pos: [10, -8, 8], intro: 'Connected over MCP. Runs hybrid search (BM25 + kNN) over the indexed notes and returns ranked passages.', suggestions: ['Search meetings about pricing', 'Find every note mentioning Claude Code', 'Show recipes I saved last month'], voice: 'ranked' },\n  { id: 'claude-code', name: 'Claude Code', protocol: 'ACP', color: '#ff7a59', pos: [1, 10, -6], intro: 'Connected over ACP. Reads the markdown files behind the Technology brain and can edit or link them.', suggestions: ['Summarize the deploy notes', 'Which files link to the repo map?', 'Draft a migration plan from the schema notes'], voice: 'read' },\n];\nconst esc = s => s.replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\nfunction md(text, byGid) {\n  const inline = s => esc(s)\n    .replace(/\\[\\[([^\\]|]+)\\|(\\d+)\\]\\]/g, (_, n, g) => `<a class=\"wiki\" data-note=\"${g}\">${n}<\u002Fa>`)\n    .replace(/\\*\\*([^*]+)\\*\\*/g, '<strong>$1<\u002Fstrong>').replace(/`([^`]+)`/g, '<code>$1<\u002Fcode>');\n  const out = []; let list = null;\n  for (const line of text.split('\\n')) {\n    if (line.startsWith('- ')) { if (!list) { list = []; } list.push(`<li>${inline(line.slice(2))}<\u002Fli>`); continue; }\n    if (list) { out.push(`<ul>${list.join('')}<\u002Ful>`); list = null; }\n    if (!line.trim()) continue;\n    if (line.startsWith('# ')) out.push(`<h1>${inline(line.slice(2))}<\u002Fh1>`);\n    else if (line.startsWith('## ')) out.push(`<h2>${inline(line.slice(3))}<\u002Fh2>`);\n    else if (line.startsWith('> ')) out.push(`<blockquote>${inline(line.slice(2))}<\u002Fblockquote>`);\n    else out.push(`<p>${inline(line)}<\u002Fp>`);\n  }\n  if (list) out.push(`<ul>${list.join('')}<\u002Ful>`);\n  return out.join('');\n}\nclass Component extends DCLogic {\n  state = { leftOpen: false, agentId: null, chats: {}, draft: '', rightOpen: false, query: '', results: [], note: null, noteFrom: null, hover: null, agentHover: null, brainFocus: null, brainStats: [], status: null };\n  canvasRef = React.createRef(); searchRef = React.createRef(); noteCache = {};\n  componentDidMount() { this.boot(); this._key = e => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { e.preventDefault(); this.openSearch(); } }; window.addEventListener('keydown', this._key); }\n  componentWillUnmount() { clearTimeout(this._t); clearInterval(this._stream); window.removeEventListener('keydown', this._key); if (this.viz) this.viz.dispose(); }\n  boot() {\n    if (!window.BrainUniverse || !this.canvasRef.current) { this._t = setTimeout(() => this.boot(), 120); return; }\n    this.viz = window.BrainUniverse.create(this.canvasRef.current, {\n      brains: BRAINS, agents: AGENTS, options: this.vizOptions(),\n      onHover: n => this.setState({ hover: n }), onAgentHover: a => this.setState({ agentHover: a }),\n      onNodeClick: n => this.openNote(n.gid, null), onNodeOpen: n => this.openNote(n.gid, null),\n      onAgentOpen: a => this.openChat(a.id), onAgentClick: a => this.setState({ status: `${a.name} · double-click to chat` }),\n      onEmptyClick: () => { if (this.viz) this.viz.focusNode(-1); this.setState({ status: null }); },\n    });\n    this.nodes = this.viz.nodes;\n    this.setState({ brainStats: this.viz.brains });\n  }\n  vizOptions() { return { rotationSpeed: this.props.rotationSpeed ?? 0.35, linkOpacity: this.props.linkOpacity ?? 0.24, showAllLabels: this.props.showAllLabels ?? false }; }\n  componentDidUpdate(pp) { if (this.viz && (pp.rotationSpeed !== this.props.rotationSpeed || pp.linkOpacity !== this.props.linkOpacity || pp.showAllLabels !== this.props.showAllLabels)) this.viz.setOptions(this.vizOptions()); }\n  // ---- notes\n  noteMd(n) {\n    if (this.noteCache[n.gid]) return this.noteCache[n.gid];\n    const L = n.links.map(g => this.nodes[g]).slice(0, 6), w = i => L[i] ? `[[${L[i].name}|${L[i].gid}]]` : '`(unlinked)`';\n    const t = `# ${n.name}\\n> ${n.source} · ${n.brain} brain · ${n.links.length} links\\nThis note lives in the **${n.brain}** brain under ${n.source}. It was captured as a markdown file and indexed so agents can cite it. The strongest connection here is to ${w(0)}, which shares most of its context, and to ${w(1)}.\\n## Key points\\n- Related decisions were recorded in ${w(2)}.\\n- Follow-up context sits in ${w(3)}; treat this note as the entry point.\\n- Tagged \\`${n.sourceId}\\` so the ${n.brain} brain ribbons it with its siblings.\\n## Related\\n- ${w(4)}\\n- ${w(5)}\\n- ${w(0)}`;\n    return (this.noteCache[n.gid] = t);\n  }\n  openNote(gid, from) { const n = this.nodes?.[gid]; if (!n) return; this.setState({ rightOpen: true, note: n, noteFrom: from ?? (this.state.results.length ? 'results' : null) }); if (this.viz) this.viz.focusNode(gid); }\n  openSearch() { this.setState({ rightOpen: true, note: null }, () => setTimeout(() => this.searchRef.current?.focus(), 350)); }\n  setQuery(q) { const ids = this.viz ? this.viz.search(q) : []; this.setState({ query: q, results: ids.slice(0, 60), note: q ? null : this.state.note }); }\n  // ---- chat\n  openChat(id) { this.setState({ leftOpen: true, agentId: id, draft: '' }); if (this.viz) this.viz.setAgentActive(id); }\n  send(text) {\n    const s = this.state, a = AGENTS.find(x => x.id === s.agentId); text = (text || s.draft).trim(); if (!a || !text || this._stream) return;\n    const chat = [...(s.chats[a.id] || []), { role: 'user', text }];\n    this.setState({ chats: { ...s.chats, [a.id]: chat }, draft: '' });\n    const words = text.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 3 && !['what', 'which', 'about', 'every', 'note', 'notes', 'show', 'find', 'from', 'that', 'with', 'connect', 'summarize', 'search', 'saved', 'last', 'month', 'know', 'draft', 'plan'].includes(w));\n    let hits = this.nodes.filter(n => words.some(w => n.name.toLowerCase().includes(w) || n.source.toLowerCase().includes(w) || n.brain.toLowerCase().includes(w)));\n    hits.sort((p, q) => q.links.length - p.links.length); hits = hits.slice(0, 3);\n    if (hits.length < 2) { const hubs = this.nodes.filter(n => n.links.length > 5 && !hits.includes(n)); while (hits.length < 3 && hubs.length) hits.push(hubs.splice(Math.floor(Math.random() * hubs.length), 1)[0]); }\n    const brainsHit = [...new Set(hits.map(h => h.brain))].join(', ');\n    const lead = a.id === 'elastic' ? `Ran a hybrid query (BM25 + kNN) over ${this.nodes.length} indexed notes. Top ${hits.length} ranked passages come from ${brainsHit}:`\n      : a.id === 'claude-code' ? `Read the linked markdown over ACP and followed the wiki links. ${hits.length} files are most relevant, spanning ${brainsHit}:`\n      : `I traced the connections across your brains. ${hits.length} notes anchor this, spanning ${brainsHit}:`;\n    const body = hits.map(h => `\\n• ${h.name} — ${h.source}, ${h.brain}. ${h.links.length} links, including ${this.nodes[h.links[0]]?.name ?? 'siblings'}.`).join('');\n    const tail = a.id === 'elastic' ? '\\n\\nScores are normalized; open a citation to read the passage in context.' : a.id === 'claude-code' ? '\\n\\nI can edit any of these files or add links between them — say which.' : '\\n\\nOpen a citation to see the note, or ask me to go deeper on any thread.';\n    const full = lead + body + tail, cites = hits.map(h => h.gid);\n    const msg = { role: 'agent', text: '', cites: [], streaming: true };\n    setTimeout(() => {\n      const ch = () => this.state.chats[a.id] || [];\n      this.setState({ chats: { ...this.state.chats, [a.id]: [...ch(), msg] } });\n      let i = 0;\n      this._stream = setInterval(() => {\n        i = Math.min(full.length, i + 3); msg.text = full.slice(0, i);\n        if (i >= full.length) { clearInterval(this._stream); this._stream = null; msg.streaming = false; msg.cites = cites; if (this.viz) this.viz.signal(a.id, cites); }\n        this.forceUpdate();\n      }, 14);\n    }, 450);\n  }\n  renderVals() {\n    const s = this.state, agent = AGENTS.find(x => x.id === s.agentId) || AGENTS[0], chat = s.chats[agent.id] || [];\n    const total = (s.brainStats || []).reduce((acc, b) => acc + b.notes, 0);\n    const focus = s.hover;\n    const statusLabel = s.agentHover ? `${s.agentHover.name} · ${s.agentHover.protocol} · double-click to chat · drag to move`\n      : focus ? `${focus.name} · ${focus.brain} · ${focus.source} · ${focus.links.length} links`\n      : s.status ? s.status : `${BRAINS.length} brains · ${total.toLocaleString()} notes · ${AGENTS.length} agents`;\n    const note = s.note;\n    const cite = g => { const n = this.nodes?.[g]; return n ? { gid: g, name: n.name, color: n.color, brain: n.brain.toUpperCase(), onClick: () => this.openNote(g, 'chat') } : null; };\n    return {\n      canvasRef: this.canvasRef, searchRef: this.searchRef,\n      leftWidth: s.leftOpen ? 'clamp(320px, 33.333%, 440px)' : '0px', leftInner: 'clamp(320px, 33.333vw, 440px)', rightWidth: s.rightOpen ? 'clamp(340px, 30%, 420px)' : '0px', rightInner: 'clamp(340px, 30vw, 420px)',\n      agentName: agent.name, agentColor: agent.color, agentMeta: `${agent.protocol} · ${chat.length ? chat.length + ' MESSAGES' : 'READY'}`, agentIntro: agent.intro,\n      suggestions: agent.suggestions.map(t => ({ text: t, onClick: () => this.send(t) })),\n      chatEmpty: chat.length === 0,\n      messages: chat.map(m => { const isA = m.role === 'agent'; return { text: m.text, align: isA ? 'flex-start' : 'flex-end', pad: isA ? '2px 0' : '10px 14px', bg: isA ? 'transparent' : 'rgba(127,216,232,.08)', border: isA ? 'transparent' : 'rgba(127,216,232,.16)', color: agent.color, cursorDisplay: m.streaming ? 'inline-block' : 'none', hasCites: !!(m.cites && m.cites.length), cites: (m.cites || []).map(cite).filter(Boolean) }; }),\n      draft: s.draft, draftPlaceholder: `Message ${agent.name}…`,\n      onDraft: e => this.setState({ draft: e.target.value }),\n      onDraftKey: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); } },\n      onSend: () => this.send(),\n      onCloseChat: () => { this.setState({ leftOpen: false }); if (this.viz) this.viz.setAgentActive(null); },\n      brainChips: (s.brainStats || []).map(b => { const on = s.brainFocus === b.id; return { name: b.name, notes: b.notes, border: on ? 'rgba(127,216,232,.5)' : 'transparent', bg: on ? 'rgba(127,216,232,.14)' : 'transparent', fg: on ? '#fff' : '#c7d2df', onClick: () => { const next = on ? null : b.id; this.setState({ brainFocus: next }); if (this.viz) this.viz.focusBrain(next); } }; }),\n      onOpenSearch: () => this.openSearch(),\n      onReset: () => { this.setState({ brainFocus: null, status: null }); if (this.viz) { this.viz.resetView(); this.viz.focusNode(-1); } },\n      statusLabel, statusColor: s.agentHover ? s.agentHover.color : focus ? focus.color : '#7fd8e8',\n      query: s.query, onQuery: e => this.setQuery(e.target.value),\n      onCloseRight: () => { this.setState({ rightOpen: false, note: null }); if (this.viz) this.viz.focusNode(-1); },\n      noteOpen: !!note, resultsOpen: !note && s.results.length > 0, rightEmpty: !note && s.results.length === 0,\n      resultsLabel: `${s.results.length} RESULTS${s.query ? ' FOR \"' + s.query.toUpperCase() + '\"' : ''}`,\n      results: s.results.map(g => this.nodes?.[g]).filter(Boolean).map(n => ({ name: n.name, color: n.color, meta: `${n.brain} · ${n.source}`.toUpperCase(), onClick: () => this.openNote(n.gid, 'results') })),\n      noteColor: note ? note.color : '#7fd8e8', noteCrumb: note ? `${note.brain} · ${note.source}` : '',\n      noteHtml: { __html: note ? md(this.noteMd(note), this.nodes) : '' },\n      onNoteClick: e => { const g = e.target?.dataset?.note; if (g != null) this.openNote(+g, s.noteFrom); },\n      backDisplay: note && s.noteFrom === 'results' && s.results.length ? 'inline' : 'none',\n      onBackToResults: () => { this.setState({ note: null }); if (this.viz) this.viz.focusNode(-1); },\n      linkedCount: note ? note.links.length : 0,\n      linked: note ? note.links.slice(0, 12).map(g => this.nodes[g]).filter(Boolean).map(n => ({ name: n.name, color: n.color, brain: n.brain.toUpperCase(), onClick: () => this.openNote(n.gid, s.noteFrom) })) : [],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
